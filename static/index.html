<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ask Finance</title>
  <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f5f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #1a2744;
      color: white;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      flex-shrink: 0;
    }

    header h1 { font-size: 18px; font-weight: 600; }

    .controls {
      display: flex;
      gap: 12px;
      margin-left: auto;
      align-items: center;
    }

    label { font-size: 13px; color: #ccc; }

    select {
      background: #2c3e6b;
      color: white;
      border: 1px solid #3d5099;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
      cursor: pointer;
    }

    /* ── App body ── */
    .app-body {
      flex: 1;
      display: flex;
      overflow: hidden;
    }

    /* ── Sidebar ── */
    .sidebar {
      width: 260px;
      background: #16213a;
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 14px 16px;
      border-bottom: 1px solid #253563;
    }

    #new-chat-btn {
      width: 100%;
      background: #253563;
      color: white;
      border: 1px solid #3d5099;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 13px;
      cursor: pointer;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #new-chat-btn:hover { background: #2e4080; }

    #new-chat-btn::before {
      content: "+";
      font-size: 18px;
      line-height: 1;
    }

    .sidebar-list {
      flex: 1;
      overflow-y: auto;
      padding: 8px 0;
    }

    .sidebar-list::-webkit-scrollbar { width: 4px; }
    .sidebar-list::-webkit-scrollbar-track { background: transparent; }
    .sidebar-list::-webkit-scrollbar-thumb { background: #3d5099; border-radius: 4px; }

    .sidebar-section-label {
      font-size: 11px;
      color: #6b80b0;
      padding: 10px 16px 4px;
      text-transform: uppercase;
      letter-spacing: 0.6px;
    }

    .history-item {
      padding: 9px 16px;
      cursor: pointer;
      border-radius: 6px;
      margin: 1px 8px;
      position: relative;
    }

    .history-item:hover { background: #1e3060; }
    .history-item.active { background: #253563; }

    .history-item-title {
      font-size: 13px;
      color: #d0d8f0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .history-item-meta {
      font-size: 11px;
      color: #6b80b0;
      margin-top: 2px;
    }

    .history-empty {
      padding: 24px 16px;
      font-size: 13px;
      color: #4a5a80;
      text-align: center;
    }

    /* ── Main chat area ── */
    .main-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .message {
      max-width: 780px;
      border-radius: 10px;
      padding: 14px 18px;
      line-height: 1.6;
      font-size: 14px;
    }

    .message.user {
      background: #1a2744;
      color: white;
      align-self: flex-end;
    }

    .message.assistant {
      background: white;
      border: 1px solid #e0e0e0;
      align-self: flex-start;
      width: 100%;
      max-width: 800px;
    }

    .message.assistant p { margin-bottom: 10px; }
    .message.assistant p:last-child { margin-bottom: 0; }

    .message.assistant h1,
    .message.assistant h2,
    .message.assistant h3,
    .message.assistant h4 {
      margin: 14px 0 6px;
      color: #1a2744;
      line-height: 1.3;
    }
    .message.assistant h1 { font-size: 18px; }
    .message.assistant h2 { font-size: 16px; }
    .message.assistant h3 { font-size: 15px; }
    .message.assistant h4 { font-size: 14px; }

    .message.assistant ul,
    .message.assistant ol {
      margin: 6px 0 10px 20px;
    }
    .message.assistant li { margin-bottom: 3px; }

    .message.assistant strong { font-weight: 600; }
    .message.assistant em { font-style: italic; }

    .message.assistant code {
      background: #f0f4ff;
      border-radius: 3px;
      padding: 1px 5px;
      font-family: monospace;
      font-size: 13px;
    }

    .message.assistant pre {
      background: #f0f4ff;
      border-radius: 6px;
      padding: 10px 14px;
      overflow-x: auto;
      margin: 8px 0;
    }

    .message.assistant pre code {
      background: none;
      padding: 0;
    }

    .message.assistant hr {
      border: none;
      border-top: 1px solid #e0e4f0;
      margin: 12px 0;
    }

    .message.assistant blockquote {
      border-left: 3px solid #c5d0f0;
      margin: 8px 0;
      padding: 4px 12px;
      color: #555;
    }

    .message.assistant table {
      border-collapse: collapse;
      width: 100%;
      font-size: 13px;
      margin: 12px 0;
    }

    .message.assistant th {
      background: #f0f4ff;
      border: 1px solid #d0d7e8;
      padding: 6px 10px;
      text-align: left;
    }

    .message.assistant td {
      border: 1px solid #e0e4f0;
      padding: 6px 10px;
    }

    .message.assistant .mermaid {
      margin: 14px 0;
      background: #fafafa;
      border-radius: 8px;
      padding: 12px;
      overflow-x: auto;
    }

    .tool-calls-container {
      margin-bottom: 12px;
    }

    .tool-call-card {
      background: #f8faff;
      border: 1px solid #dce4f5;
      border-radius: 8px;
      margin-bottom: 6px;
      overflow: hidden;
    }

    .tool-call-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 12px;
      cursor: pointer;
      user-select: none;
    }

    .tool-call-header:hover { background: #eef2ff; }

    .tool-call-check { color: #16a34a; font-size: 13px; }

    .tool-call-label {
      font-size: 12px;
      color: #5a70a0;
      margin-right: 2px;
    }

    .tool-call-name {
      font-size: 13px;
      font-weight: 600;
      color: #1a2744;
      flex: 1;
    }

    .tool-call-chevron {
      font-size: 10px;
      color: #5a70a0;
      transition: transform 0.2s;
    }

    .tool-call-chevron.open { transform: rotate(180deg); }

    .tool-call-body {
      border-top: 1px solid #dce4f5;
      padding: 10px 12px;
      display: none;
    }

    .tool-call-body.open { display: block; }

    .tool-response-label {
      font-size: 10px;
      font-weight: 600;
      color: #7a8aaa;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .tool-response-content {
      font-family: monospace;
      font-size: 11px;
      color: #444;
      white-space: pre-wrap;
      max-height: 220px;
      overflow-y: auto;
      background: #eef2ff;
      border-radius: 4px;
      padding: 8px 10px;
    }

    .meta {
      font-size: 11px;
      color: #999;
      margin-top: 6px;
    }

    .typing-indicator {
      background: white;
      border: 1px solid #e0e0e0;
      border-radius: 10px;
      padding: 14px 18px;
      align-self: flex-start;
      display: none;
      margin: 0 24px 8px;
      align-items: center;
      gap: 8px;
    }

    .typing-dots span {
      display: inline-block;
      width: 8px; height: 8px;
      background: #aaa;
      border-radius: 50%;
      margin: 0 2px;
      animation: bounce 1.2s infinite;
    }

    .typing-dots span:nth-child(2) { animation-delay: 0.2s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-6px); }
    }

    #typing-status {
      font-size: 12px;
      color: #888;
      font-style: italic;
    }

    .message.assistant.streaming::after {
      content: '▋';
      display: inline-block;
      animation: blink 0.8s step-end infinite;
      color: #1a2744;
      font-size: 14px;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    #input-area {
      background: white;
      border-top: 1px solid #e0e0e0;
      padding: 16px 24px;
      display: flex;
      gap: 10px;
      flex-shrink: 0;
    }

    #question-input {
      flex: 1;
      border: 1px solid #d0d0d0;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 14px;
      resize: none;
      height: 44px;
      max-height: 120px;
      overflow-y: auto;
    }

    #question-input:focus { outline: none; border-color: #1a2744; }

    #send-btn {
      background: #1a2744;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 22px;
      font-size: 14px;
      cursor: pointer;
      height: 44px;
    }

    #send-btn:disabled { background: #aaa; cursor: not-allowed; }
    #send-btn:hover:not(:disabled) { background: #253563; }

    .example-questions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 8px;
    }

    .example-btn {
      background: #f0f4ff;
      border: 1px solid #c5d0f0;
      border-radius: 16px;
      padding: 5px 12px;
      font-size: 12px;
      cursor: pointer;
      color: #1a2744;
    }

    .example-btn:hover { background: #e0e8ff; }

    .welcome {
      text-align: center;
      color: #888;
      margin: auto;
      padding: 40px;
    }

    .welcome h2 { font-size: 22px; color: #1a2744; margin-bottom: 8px; }
    .welcome p { font-size: 14px; margin-bottom: 16px; }

    /* ── Dashboard ── */
    #dashboard-bar {
      background: #f0f4ff;
      border-bottom: 1px solid #dce4f5;
      padding: 7px 24px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      user-select: none;
      flex-shrink: 0;
    }

    #dashboard-bar:hover { background: #e6ecff; }

    .dash-title {
      font-size: 13px;
      font-weight: 600;
      color: #1a2744;
    }

    #dash-period {
      font-size: 11px;
      color: #5a70a0;
      background: #dce4f5;
      padding: 2px 8px;
      border-radius: 10px;
    }

    #dash-chevron {
      margin-left: auto;
      font-size: 11px;
      color: #5a70a0;
      transition: transform 0.3s ease;
    }

    #dash-chevron.open { transform: rotate(180deg); }

    #dashboard-panel {
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.35s ease;
      background: white;
      border-bottom: 1px solid #e0e0e0;
      flex-shrink: 0;
    }

    #dashboard-panel.open { max-height: 340px; }

    .kpi-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      padding: 14px 24px 10px;
    }

    .kpi-card {
      background: #f8faff;
      border: 1px solid #dce4f5;
      border-radius: 8px;
      padding: 10px 14px;
    }

    .kpi-label {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #7a8aaa;
      margin-bottom: 4px;
    }

    .kpi-value {
      font-size: 20px;
      font-weight: 700;
      color: #1a2744;
      line-height: 1.2;
    }

    .kpi-change {
      font-size: 11px;
      margin-top: 3px;
    }

    .kpi-change.up   { color: #16a34a; }
    .kpi-change.down { color: #dc2626; }
    .kpi-change.neutral { color: #888; }

    .charts-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 0 24px 14px;
    }

    .chart-box {
      background: #f8faff;
      border: 1px solid #dce4f5;
      border-radius: 8px;
      padding: 10px 14px;
    }

    .chart-box-title {
      font-size: 11px;
      font-weight: 600;
      color: #5a70a0;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }

    .chart-canvas-wrap {
      position: relative;
      height: 140px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Ask Finance</h1>
    <div class="controls">
      <label>User:</label>
      <select id="user-select">
        <option value="alice">Alice (Analyst — Electronics / Asia)</option>
        <option value="bob">Bob (BU GM — Electronics / All)</option>
        <option value="carol">Carol (BU GM — Consumer Goods / All)</option>
        <option value="david">David (Group CFO — All BUs / All)</option>
      </select>
    </div>
  </header>

  <!-- Dashboard toggle bar -->
  <div id="dashboard-bar" onclick="toggleDashboard()">
    <span class="dash-title">Dashboard</span>
    <span id="dash-period">—</span>
    <span id="dash-chevron">&#9660;</span>
  </div>

  <!-- Dashboard panel -->
  <div id="dashboard-panel">
    <div class="kpi-row">
      <div class="kpi-card">
        <div class="kpi-label">Revenue</div>
        <div class="kpi-value" id="kpi-revenue">—</div>
        <div class="kpi-change neutral" id="kpi-revenue-chg">—</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">EBIT</div>
        <div class="kpi-value" id="kpi-ebit">—</div>
        <div class="kpi-change neutral" id="kpi-ebit-chg">—</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Opex</div>
        <div class="kpi-value" id="kpi-opex">—</div>
        <div class="kpi-change neutral" id="kpi-opex-chg">—</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Net Income</div>
        <div class="kpi-value" id="kpi-net-income">—</div>
        <div class="kpi-change neutral" id="kpi-net-income-chg">—</div>
      </div>
    </div>
    <div class="charts-row">
      <div class="chart-box">
        <div class="chart-box-title">EBIT by Quarter</div>
        <div class="chart-canvas-wrap">
          <canvas id="chart-ebit-trend"></canvas>
        </div>
      </div>
      <div class="chart-box">
        <div class="chart-box-title">Opex Breakdown</div>
        <div class="chart-canvas-wrap">
          <canvas id="chart-opex-breakdown"></canvas>
        </div>
      </div>
    </div>
  </div>

  <div class="app-body">
    <!-- Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        <button id="new-chat-btn">New Chat</button>
      </div>
      <div class="sidebar-list" id="history-list"></div>
    </div>

    <!-- Main chat -->
    <div class="main-area">
      <div id="chat-container">
        <div class="welcome" id="welcome-msg">
          <h2>Finance Business Partner AI</h2>
          <p>Ask questions about P&amp;L, Opex, EBIT trends, project ROI, and finance policies.</p>
          <div class="example-questions">
            <button class="example-btn" onclick="setQuestion(this.textContent)">What was Electronics EBIT in Q2 2023?</button>
            <button class="example-btn" onclick="setQuestion(this.textContent)">Show me the EBIT trend for 2023</button>
            <button class="example-btn" onclick="setQuestion(this.textContent)">Compare Q2 vs Q1 Opex variance for Electronics</button>
            <button class="example-btn" onclick="setQuestion(this.textContent)">What is EBIT margin and how is it calculated?</button>
            <button class="example-btn" onclick="setQuestion(this.textContent)">Show me all project ROI data</button>
            <button class="example-btn" onclick="setQuestion(this.textContent)">What is the Opex variance policy?</button>
          </div>
        </div>
      </div>

      <div class="typing-indicator" id="typing">
        <div class="typing-dots"><span></span><span></span><span></span></div>
        <span id="typing-status"></span>
      </div>

      <div id="input-area">
        <textarea id="question-input" placeholder="Ask a finance question..." rows="1"></textarea>
        <button id="send-btn" onclick="sendMessage()">Send</button>
      </div>
    </div>
  </div>

  <script>
    mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'loose' });
    marked.setOptions({ breaks: true, gfm: true });

    const input = document.getElementById('question-input');
    const sendBtn = document.getElementById('send-btn');
    const chatContainer = document.getElementById('chat-container');
    const typing = document.getElementById('typing');
    const historyList = document.getElementById('history-list');

    // ── History storage (localStorage) ──────────────────────────────────────

    function storageKey(user) {
      return `ask_finance_history_${user}`;
    }

    function loadHistory(user) {
      try {
        return JSON.parse(localStorage.getItem(storageKey(user)) || '[]');
      } catch { return []; }
    }

    function saveHistory(user, history) {
      localStorage.setItem(storageKey(user), JSON.stringify(history));
    }

    function getConversation(user, threadId) {
      return loadHistory(user).find(c => c.thread_id === threadId) || null;
    }

    function upsertConversation(user, conv) {
      const history = loadHistory(user);
      const idx = history.findIndex(c => c.thread_id === conv.thread_id);
      if (idx >= 0) history[idx] = conv;
      else history.unshift(conv);
      saveHistory(user, history);
    }

    // ── Active thread state ──────────────────────────────────────────────────

    let activeThreadId = null;

    function generateUUID() {
      return (crypto.randomUUID?.bind(crypto) ??
        (() => ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>
          (c ^ (crypto.getRandomValues(new Uint8Array(1))[0] & (15 >> c / 4))).toString(16)
        )))();
    }

    function currentUser() {
      return document.getElementById('user-select').value;
    }

    function startNewThread() {
      activeThreadId = generateUUID();
      return activeThreadId;
    }

    // ── Sidebar rendering ────────────────────────────────────────────────────

    function formatRelativeTime(isoString) {
      const date = new Date(isoString);
      const now = new Date();
      const diffMs = now - date;
      const diffMins = Math.floor(diffMs / 60000);
      const diffHours = Math.floor(diffMs / 3600000);
      const diffDays = Math.floor(diffMs / 86400000);
      if (diffMins < 1) return 'Just now';
      if (diffMins < 60) return `${diffMins}m ago`;
      if (diffHours < 24) return `${diffHours}h ago`;
      if (diffDays < 7) return `${diffDays}d ago`;
      return date.toLocaleDateString();
    }

    function renderSidebar() {
      const user = currentUser();
      const history = loadHistory(user);
      historyList.innerHTML = '';

      if (history.length === 0) {
        historyList.innerHTML = '<div class="history-empty">No conversations yet</div>';
        return;
      }

      historyList.innerHTML = '<div class="sidebar-section-label">Recent</div>';

      history.forEach(conv => {
        const item = document.createElement('div');
        item.className = 'history-item' + (conv.thread_id === activeThreadId ? ' active' : '');
        item.dataset.threadId = conv.thread_id;
        item.innerHTML = `
          <div class="history-item-title">${escapeHtml(conv.title)}</div>
          <div class="history-item-meta">${formatRelativeTime(conv.updated_at)}</div>
        `;
        item.addEventListener('click', () => loadConversation(conv.thread_id));
        historyList.appendChild(item);
      });
    }

    function escapeHtml(str) {
      return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    function setActiveSidebarItem(threadId) {
      historyList.querySelectorAll('.history-item').forEach(el => {
        el.classList.toggle('active', el.dataset.threadId === threadId);
      });
    }

    // ── Load a past conversation ─────────────────────────────────────────────

    async function loadConversation(threadId) {
      const user = currentUser();
      const conv = getConversation(user, threadId);
      if (!conv) return;

      activeThreadId = threadId;
      clearChat();

      for (const msg of conv.messages) {
        if (msg.role === 'user') {
          appendMessage('user', msg.text);
        } else {
          await appendAssistantMessage(msg.text, msg.role_label, msg.user_bu, msg.tools_used || [], msg.data_sources || []);
        }
      }

      setActiveSidebarItem(threadId);
    }

    // ── New chat ─────────────────────────────────────────────────────────────

    document.getElementById('new-chat-btn').addEventListener('click', () => {
      startNewThread();
      clearChat();
      showWelcome();
      setActiveSidebarItem(null);
    });

    function clearChat() {
      chatContainer.innerHTML = '';
    }

    function showWelcome() {
      chatContainer.innerHTML = `
        <div class="welcome" id="welcome-msg">
          <h2>Finance Business Partner AI</h2>
          <p>Ask questions about P&amp;L, Opex, EBIT trends, project ROI, and finance policies.</p>
          <div class="example-questions">
            <button class="example-btn" onclick="setQuestion(this.textContent)">What was Electronics EBIT in Q2 2023?</button>
            <button class="example-btn" onclick="setQuestion(this.textContent)">Show me the EBIT trend for 2023</button>
            <button class="example-btn" onclick="setQuestion(this.textContent)">Compare Q2 vs Q1 Opex variance for Electronics</button>
            <button class="example-btn" onclick="setQuestion(this.textContent)">What is EBIT margin and how is it calculated?</button>
            <button class="example-btn" onclick="setQuestion(this.textContent)">Show me all project ROI data</button>
            <button class="example-btn" onclick="setQuestion(this.textContent)">What is the Opex variance policy?</button>
          </div>
        </div>`;
    }

    // ── User switch ───────────────────────────────────────────────────────────

    document.getElementById('user-select').addEventListener('change', () => {
      startNewThread();
      clearChat();
      showWelcome();
      renderSidebar();
      if (dashOpen) loadDashboard();
    });

    // ── Input handling ────────────────────────────────────────────────────────

    input.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    function setQuestion(text) {
      input.value = text;
      input.focus();
      const welcome = document.getElementById('welcome-msg');
      if (welcome) welcome.remove();
    }

    // ── Send message ──────────────────────────────────────────────────────────

    async function sendMessage() {
      const question = input.value.trim();
      if (!question) return;

      const user = currentUser();

      const welcome = document.getElementById('welcome-msg');
      if (welcome) welcome.remove();

      if (!activeThreadId) startNewThread();

      const threadId = activeThreadId;
      const isNewConversation = !getConversation(user, threadId);

      if (isNewConversation) {
        const now = new Date().toISOString();
        upsertConversation(user, {
          thread_id: threadId,
          title: question.length > 60 ? question.slice(0, 57) + '…' : question,
          created_at: now,
          updated_at: now,
          messages: [],
        });
        renderSidebar();
      }

      appendMessage('user', question);
      input.value = '';
      sendBtn.disabled = true;

      const conv = getConversation(user, threadId);
      conv.messages.push({ role: 'user', text: question });
      conv.updated_at = new Date().toISOString();
      upsertConversation(user, conv);

      const typingStatus = document.getElementById('typing-status');
      typingStatus.textContent = '';
      typing.style.display = 'flex';
      chatContainer.scrollTop = chatContainer.scrollHeight;

      try {
        const res = await fetch('/chat/stream', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ user, question, thread_id: threadId }),
        });

        if (!res.ok) {
          const err = await res.json();
          throw new Error(err.detail || 'Request failed');
        }

        const reader = res.body.getReader();
        const decoder = new TextDecoder();
        let sseBuffer = '';
        let streamWrapper = null;
        let toolsContainer = null;
        let textContainer = null;
        let streamText = '';
        let doneData = null;
        let activeTools = new Set();
        let toolStatusEl = null;

        function ensureStreamWrapper() {
          if (!streamWrapper) {
            typing.style.display = 'none';
            streamWrapper = document.createElement('div');
            streamWrapper.className = 'message assistant streaming';
            toolsContainer = document.createElement('div');
            toolsContainer.className = 'tool-calls-container';
            textContainer = document.createElement('div');
            streamWrapper.appendChild(toolsContainer);
            streamWrapper.appendChild(textContainer);
            chatContainer.appendChild(streamWrapper);
          }
        }

        function updateToolStatus() {
          if (!toolsContainer) return;

          if (activeTools.size > 0) {
            if (!toolStatusEl) {
              toolStatusEl = document.createElement('div');
              toolStatusEl.style.cssText = 'padding: 8px 12px; background: #f0f4ff; border-radius: 4px; font-size: 13px; color: #5a70a0; margin-bottom: 8px; display: flex; gap: 6px; align-items: center;';
            }
            const toolsList = Array.from(activeTools).join(', ');
            toolStatusEl.innerHTML = `<span style="animation: spin 1s linear infinite;">⚙️</span> Using: <strong>${toolsList}</strong>`;
            if (!toolStatusEl.parentElement) {
              toolsContainer.insertBefore(toolStatusEl, toolsContainer.firstChild);
            }
            typingStatus.textContent = '';
          } else if (toolStatusEl && toolStatusEl.parentElement) {
            toolStatusEl.remove();
            toolStatusEl = null;
          }
        }

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          sseBuffer += decoder.decode(value, { stream: true });
          const lines = sseBuffer.split('\n');
          sseBuffer = lines.pop();

          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const evt = JSON.parse(line.slice(6));

            if (evt.type === 'token') {
              ensureStreamWrapper();
              streamText += evt.content;
              textContainer.innerHTML = marked.parse(streamText);
              chatContainer.scrollTop = chatContainer.scrollHeight;

            } else if (evt.type === 'tool_result') {
              ensureStreamWrapper();
              if (evt.name && activeTools.has(evt.name)) {
                activeTools.delete(evt.name);
              }
              toolsContainer.appendChild(createToolCard(evt.name, evt.content));
              updateToolStatus();
              chatContainer.scrollTop = chatContainer.scrollHeight;

            } else if (evt.type === 'status') {
              ensureStreamWrapper();
              const toolMatch = evt.message.match(/Using\s+(.+?)…/);
              if (toolMatch) {
                activeTools.add(toolMatch[1]);
                updateToolStatus();
              } else {
                typingStatus.textContent = evt.message;
              }

            } else if (evt.type === 'done') {
              doneData = evt;

            } else if (evt.type === 'error') {
              throw new Error(evt.message);
            }
          }
        }

        typing.style.display = 'none';

        if (streamWrapper) {
          streamWrapper.classList.remove('streaming');
          const meta = doneData || {};

          const mermaidRegex = /```mermaid[\s\S]*?```/g;
          const hasMermaid = mermaidRegex.test(streamText);

          if (hasMermaid) {
            const mermaidBlocks = streamText.match(/```mermaid[\s\S]*?```/g) || [];
            for (const block of mermaidBlocks) {
              const code = block.replace(/^```mermaid\n?/, '').replace(/```$/, '').trim();
              const chartDiv = document.createElement('div');
              chartDiv.className = 'mermaid';
              chartDiv.textContent = code;
              streamWrapper.appendChild(chartDiv);
            }
          }

          if (meta.role) {
            const metaDiv = document.createElement('div');
            metaDiv.className = 'meta';
            const roleLabel = meta.role.replace('_', ' ').toUpperCase();
            const buLabel = meta.user_bu || 'All';
            const sourceParts = [];
            if (meta.data_sources?.length) sourceParts.push(`Source: ${meta.data_sources.join(', ')}`);
            if (meta.tools_used?.length) sourceParts.push(`Tools: ${meta.tools_used.join(', ')}`);
            metaDiv.textContent = [roleLabel + ' · ' + buLabel, ...sourceParts].join(' · ');
            streamWrapper.appendChild(metaDiv);
          }

          const charts = streamWrapper.querySelectorAll('.mermaid');
          if (charts.length > 0) {
            try {
              await mermaid.run({ nodes: Array.from(charts) });
            } catch (e) {
              console.warn('Mermaid render error:', e);
            }
          }
        }

        const finalData = doneData || {};
        const updatedConv = getConversation(user, threadId);
        updatedConv.messages.push({
          role: 'assistant',
          text: streamText,
          role_label: finalData.role,
          user_bu: finalData.user_bu,
          tools_used: finalData.tools_used || [],
          data_sources: finalData.data_sources || [],
        });
        updatedConv.updated_at = new Date().toISOString();
        upsertConversation(user, updatedConv);
        renderSidebar();
        setActiveSidebarItem(threadId);

      } catch (err) {
        typing.style.display = 'none';
        appendMessage('assistant', `Error: ${err.message}`);
      }

      sendBtn.disabled = false;
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    // ── Tool call cards ───────────────────────────────────────────────────────

    function createToolCard(name, content) {
      const card = document.createElement('div');
      card.className = 'tool-call-card';

      const header = document.createElement('div');
      header.className = 'tool-call-header';
      header.innerHTML = `
        <span class="tool-call-check">✓</span>
        <span class="tool-call-label">Used tool:</span>
        <span class="tool-call-name">${escapeHtml(name)}</span>
        <span class="tool-call-chevron">&#9660;</span>
      `;

      const body = document.createElement('div');
      body.className = 'tool-call-body';
      body.innerHTML = `
        <div class="tool-response-label">Tool response:</div>
        <div class="tool-response-content">${escapeHtml(content)}</div>
      `;

      header.addEventListener('click', () => {
        const chevron = header.querySelector('.tool-call-chevron');
        body.classList.toggle('open');
        chevron.classList.toggle('open');
      });

      card.appendChild(header);
      card.appendChild(body);
      return card;
    }

    // ── Message rendering ─────────────────────────────────────────────────────

    function appendMessage(role, text) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.textContent = text;
      chatContainer.appendChild(div);
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function renderAssistantContent(wrapper, text, meta = {}, contentEl = null) {
      const target = contentEl || wrapper;
      const { role, user_bu: userBu, tools_used: toolsUsed = [], data_sources: dataSources = [] } = meta;

      const parts = text.split(/(```mermaid[\s\S]*?```)/g);
      for (const part of parts) {
        if (part.startsWith('```mermaid')) {
          const code = part.replace(/^```mermaid\n?/, '').replace(/```$/, '').trim();
          const chartDiv = document.createElement('div');
          chartDiv.className = 'mermaid';
          chartDiv.textContent = code;
          target.appendChild(chartDiv);
        } else if (part.trim()) {
          const div = document.createElement('div');
          div.innerHTML = marked.parse(part);
          target.appendChild(div);
        }
      }

      if (role) {
        const metaDiv = document.createElement('div');
        metaDiv.className = 'meta';
        const roleLabel = role.replace('_', ' ').toUpperCase();
        const buLabel = userBu || 'All';
        const sourceParts = [];
        if (dataSources.length) sourceParts.push(`Source: ${dataSources.join(', ')}`);
        if (toolsUsed.length) sourceParts.push(`Tools: ${toolsUsed.join(', ')}`);
        metaDiv.textContent = [roleLabel + ' · ' + buLabel, ...sourceParts].join(' · ');
        wrapper.appendChild(metaDiv);
      }

      const charts = target.querySelectorAll('.mermaid');
      if (charts.length > 0) {
        try {
          await mermaid.run({ nodes: Array.from(charts) });
        } catch (e) {
          console.warn('Mermaid render error:', e);
        }
      }

      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    async function appendAssistantMessage(text, role, userBu, toolsUsed = [], dataSources = []) {
      const wrapper = document.createElement('div');
      wrapper.className = 'message assistant';
      chatContainer.appendChild(wrapper);
      await renderAssistantContent(wrapper, text, { role, user_bu: userBu, tools_used: toolsUsed, data_sources: dataSources });
    }

    // ── Dashboard ─────────────────────────────────────────────────────────────

    let chartEbit = null;
    let chartOpex = null;
    let dashOpen = false;

    function toggleDashboard() {
      const panel = document.getElementById('dashboard-panel');
      const chevron = document.getElementById('dash-chevron');
      dashOpen = !dashOpen;
      panel.classList.toggle('open', dashOpen);
      chevron.classList.toggle('open', dashOpen);
      if (dashOpen) loadDashboard();
    }

    function fmtM(val) {
      return `$${val.toFixed(1)}M`;
    }

    function fmtChange(chg) {
      const arrow = chg > 0 ? '▲' : chg < 0 ? '▼' : '—';
      const cls   = chg > 0 ? 'up' : chg < 0 ? 'down' : 'neutral';
      return { text: `${arrow} ${Math.abs(chg)}% vs prior period`, cls };
    }

    async function loadDashboard() {
      const user = currentUser();
      try {
        const res  = await fetch(`/dashboard?user=${user}`);
        const data = await res.json();

        document.getElementById('dash-period').textContent = data.latest_period;

        const kpis = [
          ['revenue',    'kpi-revenue',    'kpi-revenue-chg'],
          ['ebit',       'kpi-ebit',       'kpi-ebit-chg'],
          ['opex',       'kpi-opex',       'kpi-opex-chg'],
          ['net_income', 'kpi-net-income', 'kpi-net-income-chg'],
        ];

        kpis.forEach(([key, valId, chgId]) => {
          const { value, change } = data.kpis[key];
          document.getElementById(valId).textContent = fmtM(value);
          const { text, cls } = fmtChange(change);
          const el = document.getElementById(chgId);
          el.textContent = text;
          el.className = `kpi-change ${cls}`;
        });

        renderCharts(data.ebit_trend, data.opex_breakdown);
      } catch (e) {
        console.warn('Dashboard load error:', e);
      }
    }

    function renderCharts(trend, breakdown) {
      if (chartEbit) chartEbit.destroy();
      if (chartOpex) chartOpex.destroy();

      const labels = trend.map(t => t.period.replace('2023-', '').replace('Q', 'Q') + "-23");

      chartEbit = new Chart(
        document.getElementById('chart-ebit-trend'),
        {
          type: 'bar',
          data: {
            labels,
            datasets: [{
              data: trend.map(t => t.ebit),
              backgroundColor: '#3b82f6',
              borderRadius: 4,
              borderSkipped: false,
            }],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: { display: false },
              tooltip: { callbacks: { label: ctx => ` $${ctx.raw}M` } },
            },
            scales: {
              y: {
                beginAtZero: false,
                ticks: { callback: v => `$${v}M`, font: { size: 10 } },
                grid: { color: '#eef0f8' },
              },
              x: {
                ticks: { font: { size: 10 } },
                grid: { display: false },
              },
            },
          },
        }
      );

      chartOpex = new Chart(
        document.getElementById('chart-opex-breakdown'),
        {
          type: 'doughnut',
          data: {
            labels: Object.keys(breakdown),
            datasets: [{
              data: Object.values(breakdown),
              backgroundColor: ['#3b82f6', '#8b5cf6', '#06b6d4', '#f59e0b', '#6b7280'],
              borderWidth: 0,
              hoverOffset: 4,
            }],
          },
          options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
              legend: {
                position: 'right',
                labels: { font: { size: 10 }, boxWidth: 10, padding: 6 },
              },
              tooltip: {
                callbacks: {
                  label: ctx => {
                    const total = ctx.dataset.data.reduce((a, b) => a + b, 0);
                    const pct   = ((ctx.raw / total) * 100).toFixed(0);
                    return ` $${ctx.raw}M (${pct}%)`;
                  },
                },
              },
            },
          },
        }
      );
    }

    // ── Init ──────────────────────────────────────────────────────────────────

    startNewThread();
    renderSidebar();
    // Open dashboard by default
    toggleDashboard();
  </script>
</body>
